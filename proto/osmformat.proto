// OSM PBF 数据格式（osmformat.proto）
// 字段编号与官方 osmformat.proto 一致，只删掉了导航用不到的 osmesis 相关字段。
syntax = "proto2";

message HeaderBBox {
  required sint64 left   = 1;
  required sint64 right  = 2;
  required sint64 top    = 3;
  required sint64 bottom = 4;
}

message HeaderBlock {
  optional HeaderBBox bbox = 1;
  repeated string required_features = 4;
  repeated string optional_features = 5;
  optional string writingprogram = 16;
  optional string source = 17;
}

message StringTable {
  repeated bytes s = 1;
}

message Info {
  optional int32 version   = 1 [default = -1];
  optional int64 timestamp = 2;
  optional int64 changeset = 3;
  optional int32 uid       = 4;
  optional uint32 user_sid = 5;
  optional bool visible    = 6;
}

message DenseInfo {
  repeated int32 version     = 1 [packed = true];
  repeated sint64 timestamp  = 2 [packed = true];
  repeated sint64 changeset  = 3 [packed = true];
  repeated sint32 uid        = 4 [packed = true];
  repeated sint32 user_sid   = 5 [packed = true];
}

message DenseNodes {
  repeated sint64 id      = 1 [packed = true];   // delta 编码
  optional DenseInfo denseinfo = 5;
  repeated sint64 lat     = 8 [packed = true];   // delta 编码
  repeated sint64 lon     = 9 [packed = true];   // delta 编码
  repeated int32 keys_vals = 10 [packed = true]; // 以 0 分隔的 k,v,k,v...
}

message Node {
  required sint64 id = 1;
  repeated uint32 keys = 2 [packed = true];
  repeated uint32 vals = 3 [packed = true];
  optional Info info = 4;
  required sint64 lat = 8;
  required sint64 lon = 9;
}

message Way {
  required int64 id = 1;
  repeated uint32 keys = 2 [packed = true];
  repeated uint32 vals = 3 [packed = true];
  optional Info info = 4;
  repeated sint64 refs = 8 [packed = true];      // delta 编码
}

message Relation {
  enum MemberType {
    NODE     = 0;
    WAY      = 1;
    RELATION = 2;
  }
  required int64 id = 1;
  repeated uint32 keys = 2 [packed = true];
  repeated uint32 vals = 3 [packed = true];
  optional Info info = 4;
  repeated int32 roles_sid = 8 [packed = true];
  repeated sint64 memids   = 9 [packed = true];  // delta 编码
  repeated MemberType types = 10 [packed = true];
}

message ChangeSet {
  required int64 id = 1;
}

message PrimitiveGroup {
  repeated Node     nodes     = 1;
  optional DenseNodes dense   = 2;
  repeated Way      ways      = 3;
  repeated Relation relations = 4;
  repeated ChangeSet changesets = 5;
}

message PrimitiveBlock {
  required StringTable stringtable = 1;
  repeated PrimitiveGroup primitivegroup = 2;
  optional int32 granularity       = 17 [default = 100];   // 纳米度/单位
  optional int64 lat_offset        = 19 [default = 0];
  optional int64 lon_offset        = 20 [default = 0];
  optional int32 date_granularity  = 18 [default = 1000];
}
